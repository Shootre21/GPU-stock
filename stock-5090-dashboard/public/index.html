<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPU Hunter Stock Wall</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wall">
    <header class="topbar">
      <div>
        <p class="feed-note">USA GPU feed. Public parsing only. No buying automation.</p>
        <h1>GPU Hunter Live Stock Wall</h1>
      </div>
      <button id="scanBtn" type="button">Scan now</button>
    </header>

    <section id="status" class="ticker"></section>
    <section id="stockWall" class="stock-wall"></section>

    <section class="links-panel">
      <div class="panel-title">Direct restock links</div>
      <div id="directLinks" class="direct-links"></div>
    </section>

    <section class="lower-panel">
      <div class="drop-panel">
        <div class="panel-title">Drop history</div>
        <div id="alerts" class="drop-history"></div>
      </div>
      <div class="drop-panel">
        <div class="panel-title">Store diagnostics</div>
        <div id="storeStatus" class="diagnostics"></div>
      </div>
    </section>

    <audio id="bruhSound" preload="auto" src="/sounds/bruh.mp3"></audio>
    <audio id="fahhhSound" preload="auto" src="/sounds/fahhhh.mp3"></audio>
  </main>
  <script src="/app.js"></script>
</body>
</html>
